name: "Terraform Automation Validation"

# Trigger this workflow whenever code changes are pushed to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: "Lint and Validate Blueprints"
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down a copy of the code onto the runner machine
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Spin up the official HashiCorp Terraform engine environment
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.1

      # 3. Check if the configuration syntax layout matches standard practices
      - name: Verify Code Formatting
        run: terraform fmt -check

      # 4. Initialize structural provider schemas without linking to live cloud backends
      - name: Initialize Mock Workspace
        run: terraform init -backend=false

      # 5. Run static structural validations
      - name: Validate Infrastructure Logic
        run: terraform validate
