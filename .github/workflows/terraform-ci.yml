name: "DevOps Automated Build Pipeline"

on:
  push:
    branches:
      - main

jobs:
  infrastructure-and-containers:
    name: "Validate IAC and Push Docker Image"
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down workspace code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup and validate your Terraform files
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.1

      - name: Initialize Mock Workspace
        run: terraform init -backend=false

      - name: Validate Infrastructure Logic
        run: terraform validate

      # 3. Securely authenticate into your Cloud Docker Hub Registry
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Compile and push the versioned container image directly to the cloud
      - name: Build and Push Microservice Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Dynamically tags the image with your username and the latest commit identifier
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:${{ github.sha }}
